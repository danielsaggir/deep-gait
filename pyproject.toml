[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "deepgait"
version = "1.0.0"
description = "DeepGait — Siamese ST-GCN gait verification workstation"
requires-python = ">=3.10"
dependencies = [
    "numpy>=1.24",
]

[project.optional-dependencies]
inference = [
    "torch>=2.0",
    "opencv-python-headless>=4.8.0",
    "ultralytics>=8.3.0",
]
dev = [
    "pytest>=7.0",
    "torch>=2.0",
    "opencv-python-headless>=4.8.0",
    "ultralytics>=8.3.0",
]

[tool.setuptools]
packages = ["ml"]

[tool.setuptools.package-dir]
ml = "server/ml"

[tool.pytest.ini_options]
pythonpath = ["server"]
testpaths = ["tests"]
